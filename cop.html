<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARES COP</title>
  <link rel="icon" type="image/png" href="ARESLogo.png">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Draw CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  
  <!-- COP Specific CSS -->
  <link rel="stylesheet" href="css/cop.css" />
</head>
<body>

  <!-- Top Tactical Header -->
  <header class="cop-header">
    <a href="/" class="cop-logo-title" style="text-decoration: none; cursor: pointer;">
      <img src="ARESLogo.png" alt="ARES Logo" />
      <div class="cop-title">ARES COP</div>
    </a>
    
    <div class="cop-status" id="telemetry-status">
      <div class="cop-status-dot"></div>
      <span id="telemetry-status-text">CONNECTING...</span>
    </div>
  </header>

  <!-- Fullscreen Map Canvas -->
  <div id="cop-map-container"></div>

  <!-- Floating Video Panel (Hidden by Default) -->
  <div id="pip-container" class="pip-video-container hidden">
    <div class="pip-header" id="pip-drag-handle">
      <span class="pip-title" id="pip-title">CAM: UNKNOWN</span>
      <button class="pip-close" onclick="closePip()">×</button>
    </div>
    <video id="pip-video-player" class="pip-video" autoplay muted playsinline></video>
  </div>

  <!-- Sidebar Toggle Button -->
  <button id="sidebar-toggle" class="sidebar-toggle-btn">◀ MENU</button>

  <!-- Sliding Sidebar -->
  <div id="cop-sidebar" class="cop-sidebar-panel collapsed">
    <div class="sidebar-section">
      <h3>VIDEO FEEDS</h3>
      <div id="sidebar-streams-list" class="streams-list">
        <div class="stream-item empty">Scanning for active streams...</div>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3>TAK SERVER STATUS</h3>
      <div id="tak-status-panel" class="streams-list">
        <div class="stream-item">
          <strong id="tak-status-text" style="color:var(--red-bright);">DISCONNECTED</strong><br>
          <small id="tak-server-host" style="color:var(--grey-mid);">Waiting for telemetry...</small><br>
          <small id="tak-server-version" style="color:var(--grey-mid);"></small>
        </div>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3>TAK OBJECTS</h3>
      <div id="sidebar-tracks-list" class="streams-list" style="max-height: 250px; overflow-y: auto;">
        <div class="stream-item empty">Awaiting telemetry...</div>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3>DATA SYNC MISSIONS (TAK SPEC)</h3>
      <div style="padding: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--green-bright);">
        <label>ACTIVE MISSION:<br>
          <select id="datasync-mission-sel" style="width:100%; background:#000; color:#fff; border:1px solid var(--green-dim); margin-top:4px; padding:4px;">
            <option value="Local Tactical Mission">Local Tactical Mission</option>
            <option value="ARES Op Package Alpha">ARES Op Package Alpha</option>
            <option value="Default TAK Mission">Default TAK Mission</option>
          </select>
        </label>
        <div style="margin-top: 8px;">
          <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="datasync-local-mode" checked> Save Points to Local Mission Only (Do Not Auto-Broadcast)
          </label>
        </div>
        <div id="datasync-items-list" style="margin-top: 10px; max-height: 100px; overflow-y: auto; border: 1px solid var(--green-dim); padding: 4px; font-size: 11px; color: #aaa;">
          <div style="font-style:italic;">No local mission items yet.</div>
        </div>
        <button onclick="window.broadcastDataSyncMission()" style="margin-top:8px; background:var(--green-bright); color:#000; border:none; padding:6px; width:100%; font-weight:bold; cursor:pointer;">📡 SYNC / BROADCAST MISSION TO TAK</button>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <button onclick="window.exportMissionZip()" style="flex:1; background:#0f2a18; color:var(--green-bright); border:1px solid var(--green-mid); padding:6px; font-weight:bold; cursor:pointer;" title="Download TAK Mission Package (.zip)">📤 EXPORT .ZIP</button>
          <input type="file" id="datasync-zip-upload" accept=".zip" style="display:none;" onchange="window.importMissionZip(event)">
          <button onclick="document.getElementById('datasync-zip-upload').click()" style="flex:1; background:#0f2a18; color:var(--green-bright); border:1px solid var(--green-mid); padding:6px; font-weight:bold; cursor:pointer;" title="Import ATAK/iTAK Mission Package (.zip)">📥 IMPORT .ZIP</button>
        </div>
        <button onclick="window.fetchRemoteTakMissions()" style="margin-top:6px; background:transparent; color:var(--green-bright); border:1px dashed var(--green-mid); padding:6px; width:100%; font-weight:bold; cursor:pointer;" title="Query live missions on TAK Server REST API">🌐 FETCH REMOTE TAK MISSIONS</button>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3>INPUT MAP FILES</h3>
      <div class="control-row" style="text-align: center; margin-top: 10px;">
        <input type="file" id="map-upload-input" accept=".mbtiles" style="display: none;" onchange="handleMapUpload(event)">
        <button id="tool-upload" style="width: 100%; background: transparent; color: var(--green-bright); border: 1px solid var(--green-mid); padding: 8px; cursor: pointer; font-family: var(--font-display); font-weight: 700; border-radius: 4px;" onclick="document.getElementById('map-upload-input').click()">📁 UPLOAD MBTILES</button>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3>DEMO CONTROLS</h3>
      <div class="control-row">
        <label>Simulation Active</label>
        <input type="checkbox" id="demo-active-toggle" checked />
      </div>
      <div class="control-row">
        <label>Target Density</label>
        <input type="range" id="demo-density-slider" min="1" max="15" value="5" />
      </div>
      <div class="control-row">
        <label>Flight Pattern</label>
        <select id="demo-pattern-select">
          <option value="orbit">Circular Orbit</option>
          <option value="grid">Grid Pattern</option>
          <option value="drift">Random Drift</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Chat UI -->
  <div id="chat-panel" class="chat-panel">
    <div class="chat-header">GEOCHAT</div>
    <div style="padding: 5px; background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--green-bright);">
      <select id="chat-recipient" style="width: 100%; background: #000; color: var(--green-bright); border: 1px solid var(--green-bright); font-family: monospace; padding: 2px;">
        <option value="All Chat Rooms">All Chat Rooms (Broadcast)</option>
      </select>
    </div>
    <div id="chat-log" class="chat-log"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Transmit message..." />
      <button id="chat-send-btn">SEND</button>
    </div>
  </div>
  <button id="chat-toggle-btn" class="chat-toggle-btn">
    💬 CHAT <span id="chat-badge" class="chat-badge" style="display:none;"></span>
  </button>
  
  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Draw JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <!-- Milsymbol JS -->
  <script src="https://unpkg.com/milsymbol/dist/milsymbol.js"></script>
  <!-- HLS.js for MediaMTX video -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  
  <!-- COP Logic -->
  <script src="js/cop_map.js"></script>
  <script src="js/cop_video.js"></script>

  <script>
    // Initialize COP Map
    window.addEventListener('DOMContentLoaded', () => {
      initCopMap();
      connectTelemetry();
      initPipDraggable();
      initCopUserLocation();
    });
  </script>
</body>
</html>
