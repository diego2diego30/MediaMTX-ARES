<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARES COP</title>
  <link rel="icon" type="image/png" href="ARESLogo.png">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Draw CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  
  <!-- COP Specific CSS -->
  <link rel="stylesheet" href="css/cop.css" />
</head>
<body>

  <!-- Top Tactical Header -->
  <header class="cop-header">
    <a href="/" class="cop-logo-title" style="text-decoration: none; cursor: pointer;">
      <img src="ARESLogo.png" alt="ARES Logo" />
      <div class="cop-title">ARES COP</div>
    </a>
    
    <div class="cop-status" id="telemetry-status">
      <div class="cop-status-dot"></div>
      <span id="telemetry-status-text">CONNECTING...</span>
    </div>
  </header>

  <!-- Fullscreen Map Canvas -->
  <div id="cop-map-container"></div>

  <!-- Floating Video Panel (Hidden by Default) -->
  <div id="pip-container" class="pip-video-container hidden">
    <div class="pip-header" id="pip-drag-handle">
      <span class="pip-title" id="pip-title">CAM: UNKNOWN</span>
      <button class="pip-close" onclick="closePip()">×</button>
    </div>
    <video id="pip-video-player" class="pip-video" autoplay muted playsinline></video>
    <iframe id="pip-iframe-player" class="pip-video hidden" style="border:none;" allowfullscreen></iframe>
  </div>

  <!-- Sidebar Toggle Button -->
  <button id="sidebar-toggle" class="sidebar-toggle-btn">◀ MENU</button>

  <!-- Sliding Sidebar -->
  <div id="cop-sidebar" class="cop-sidebar-panel collapsed">
    
    <div class="sidebar-section">
      <h3>TELEMETRY INGEST</h3>
      <div id="telemetry-mode-selector" style="display:flex;background:var(--bg-panel);border:1px solid var(--green-dim);border-radius:4px;overflow:hidden;font-family:monospace;font-size:11px;font-weight:bold;margin:10px 0;">
        <button id="mode-btn-direct" onclick="window.setTelemetryMode('DIRECT')" style="flex:1;padding:8px;background:#00ff5e;color:#000;border:none;cursor:pointer;transition:all 0.2s;font-family:inherit;font-weight:bold;">⚡ 30Hz DIRECT</button>
        <button id="mode-btn-tak" onclick="window.setTelemetryMode('TAK')" style="flex:1;padding:8px;background:transparent;color:#00ff5e;border:none;cursor:pointer;transition:all 0.2s;font-family:inherit;font-weight:bold;">🛰️ TAK COT</button>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>VIDEO FEEDS</h3>
      <div id="sidebar-streams-list" class="streams-list">
        <div class="stream-item empty">Scanning for active streams...</div>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3>TAK SERVER STATUS</h3>
      <div id="tak-status-panel" class="streams-list">
        <div class="stream-item">
          <strong id="tak-status-text" style="color:var(--red-bright);">DISCONNECTED</strong><br>
          <small id="tak-server-host" style="color:var(--grey-mid);">Waiting for telemetry...</small><br>
          <small id="tak-server-version" style="color:var(--grey-mid);"></small>
        </div>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3>TAK OBJECTS</h3>
      <div id="sidebar-tracks-list" class="streams-list" style="max-height: 250px; overflow-y: auto;">
        <div class="stream-item empty">Awaiting telemetry...</div>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3 style="display:flex; justify-content:space-between; align-items:center;">
        DATA SYNC MISSIONS
        <button onclick="window.fetchRemoteTakMissions()" style="background:transparent; border:none; color:var(--green-bright); cursor:pointer; font-size:14px;" title="Refresh Missions">🔄</button>
      </h3>
      <div style="padding: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--green-bright); background: rgba(0, 255, 94, 0.05); border-radius: 4px; border: 1px solid rgba(0, 255, 94, 0.2);">
        <label style="font-weight:bold; letter-spacing:1px; color:#fff;">ACTIVE MISSION:<br>
          <select id="datasync-mission-sel" style="width:100%; background:#0a1a0f; color:#fff; border:1px solid var(--green-dim); margin-top:6px; padding:6px; font-family: var(--font-mono); border-radius:3px;">
            <option value="Local_Tactical_Mission" selected>☁️ Local Tactical Mission</option>
          </select>
        </label>
        <div style="margin-top: 10px; background: rgba(0,0,0,0.4); padding:6px; border-radius:3px;">
          <label style="cursor:pointer; display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="datasync-local-mode" checked> 
            <span style="color:#aaa;">Save to Local Only (No Auto-Broadcast)</span>
          </label>
        </div>
        
        <div id="datasync-items-list" style="margin-top: 12px; height: 110px; overflow-y: auto; border: 1px solid var(--green-dim); background: #000; padding: 6px; font-size: 11px; color: #aaa; border-radius:3px;">
          <div style="font-style:italic; text-align:center; margin-top:40px;">No local mission items yet.</div>
        </div>
        
        <button onclick="window.broadcastDataSyncMission()" style="margin-top:10px; background:var(--green-bright); color:#000; border:none; padding:8px; width:100%; font-weight:bold; cursor:pointer; border-radius:3px; letter-spacing:1px;">📡 BROADCAST MISSION</button>
        
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button onclick="window.exportMissionZip()" style="flex:1; background:#0f2a18; color:var(--green-bright); border:1px solid var(--green-mid); padding:6px; font-weight:bold; cursor:pointer; border-radius:3px;" title="Export .ZIP">📤 EXPORT</button>
          <input type="file" id="datasync-zip-upload" accept=".zip" style="display:none;" onchange="window.importMissionZip(event)">
          <button onclick="document.getElementById('datasync-zip-upload').click()" style="flex:1; background:#0f2a18; color:var(--green-bright); border:1px solid var(--green-mid); padding:6px; font-weight:bold; cursor:pointer; border-radius:3px;" title="Import .ZIP">📥 IMPORT</button>
        </div>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3>INPUT MAP FILES</h3>
      <div class="control-row" style="text-align: center; margin-top: 10px;">
        <input type="file" id="map-upload-input" accept=".mbtiles" style="display: none;" onchange="handleMapUpload(event)">
        <button id="tool-upload" style="width: 100%; background: transparent; color: var(--green-bright); border: 1px solid var(--green-mid); padding: 8px; cursor: pointer; font-family: var(--font-display); font-weight: 700; border-radius: 4px;" onclick="document.getElementById('map-upload-input').click()">📁 UPLOAD MBTILES</button>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3>DEMO CONTROLS</h3>
      <div class="control-row">
        <label>Simulation Active</label>
        <input type="checkbox" id="demo-active-toggle" checked />
      </div>
      <div class="control-row">
        <label>Target Density</label>
        <input type="range" id="demo-density-slider" min="1" max="15" value="5" />
      </div>
      <div class="control-row">
        <label>Flight Pattern</label>
        <select id="demo-pattern-select">
          <option value="orbit">Circular Orbit</option>
          <option value="grid">Grid Pattern</option>
          <option value="drift">Random Drift</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Chat UI -->
  <div id="chat-panel" class="chat-panel">
    <div class="chat-header">GEOCHAT</div>
    <div style="padding: 5px; background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--green-bright);">
      <select id="chat-recipient" style="width: 100%; background: #000; color: var(--green-bright); border: 1px solid var(--green-bright); font-family: monospace; padding: 2px;">
        <option value="All Chat Rooms">All Chat Rooms (Broadcast)</option>
      </select>
    </div>
    <div id="chat-log" class="chat-log"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Transmit message..." />
      <button id="chat-send-btn">SEND</button>
    </div>
  </div>
  <button id="chat-toggle-btn" class="chat-toggle-btn">
    💬 CHAT <span id="chat-badge" class="chat-badge" style="display:none;"></span>
  </button>
  
  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Draw JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <!-- Milsymbol JS -->
  <script src="https://unpkg.com/milsymbol/dist/milsymbol.js"></script>
  <!-- HLS.js for MediaMTX video -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  
  <!-- COP Logic -->
  <script src="js/cop_map.js"></script>
  <script src="js/cop_video.js"></script>

  <script>
    // Initialize COP Map
    window.addEventListener('DOMContentLoaded', () => {
      initCopMap();
      connectTelemetry();
      initPipDraggable();
      initCopUserLocation();
    });
  </script>
</body>
</html>
